name: Build & Test

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
    paths:
      - "crates/**"
      - "app/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "crates/**"
      - "app/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
      - name: Diagnose Windows library tests
        if: runner.os == 'Windows'
        run: cargo test -p any-player --lib --locked -- --test-threads=1 --nocapture
      - run: cargo test --workspace --locked

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: windows-latest
            formats: nsis,wix
          - os: macos-latest
            formats: dmg,app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package unsigned bundles
        run: cargo packager --release -p any-player --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: any-player-${{ runner.os }}
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  summary:
    runs-on: ubuntu-latest
    needs: [lint, test, package]
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "## Build & Test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint: ${{ needs.lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Packages: ${{ needs.package.result }}" >> "$GITHUB_STEP_SUMMARY"
