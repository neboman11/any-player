[package]
name = "any-player"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "any-player"
path = "src/main.rs"

[dependencies]
ap-model = { path = "../crates/ap-model" }
async-trait = "0.1.89"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
thiserror = "2.0"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
lru = "0.16.2"
arboard = { version = "3.6.1", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10.9"
dirs = "6.0.0"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[lints]
workspace = true
