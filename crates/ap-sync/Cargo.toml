[package]
name = "ap-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ap-model.workspace = true
ap-store = { path = "../ap-store" }
ap-playback = { path = "../ap-playback" }
ap-library = { path = "../ap-library" }
async-trait = "0.1"
futures-util = "0.3"
if-addrs = "0.13"
indexmap.workspace = true
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
