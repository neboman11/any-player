[package]
name = "ap-playback"
description = "Playback engine, Spotify Connect backend and local audio backend for Any Player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ap-model = { version = "0.2.0", path = "../ap-model" }

async-trait = "0.1"
cpal = "0.16"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
rtrb = "0.3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "vorbis", "ogg", "wav", "pcm"] }
thiserror = "2"
tokio = { version = "1.49", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
flacenc = "0.5"
hound = "3.5"
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }

[lints]
workspace = true
