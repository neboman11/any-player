[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/any-player/any-player-desktop"

[workspace.dependencies]
ap-model = { path = "crates/ap-model" }

aes-gcm = "0.10"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
proptest = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# Warnings only; CI promotes them with `-D warnings`.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic-lite: the noisy, low-value pedantic lints stay off.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
